# /etc/nginx/sites-available/cortes
# Visor de cortes de carril. Certbot añade después el bloque HTTPS (443).
server {
    listen 80;
    listen [::]:80;
    server_name cortes.geospatiallab.xyz;

    root /opt/cortes;
    index index.html;

    # Nada de backend, SQL, documentación, git ni ficheros ocultos.
    location ~ ^/(backend|sql|docs|\.git)(/|$) {
        return 404;
    }

    # (/.well-known se deja pasar para la validación de Certbot)
    location ~ /\.(?!well-known)|\.md$ {
        return 404;
    }

    # API Node (PM2: cortes-api). Se mantiene el prefijo /api.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # GeoServer (interno en 8080)
    location /geoserver/ {
        proxy_pass http://127.0.0.1:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
